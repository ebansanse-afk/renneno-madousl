<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>輪廻の魔導士</title>
<style>
*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}body{margin:0;background:#11121d;color:#f4f0e8;font:16px/1.5 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:12px}h1,h2{color:#f2c879}h1{margin:3px}.muted,small{color:#a9abc0}.stats,.grid,.cols{display:grid;gap:8px}.stats{grid-template-columns:repeat(4,1fr);margin:12px 0}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.cols{grid-template-columns:1fr 1fr}.panel,.stat{background:#1d1f30;border:1px solid #393c55;border-radius:12px;padding:12px}.stat b{display:block;font-size:18px}button,select{background:#303249;color:#fff;border:1px solid #555873;border-radius:9px;padding:9px;font-size:14px;font-weight:650;cursor:pointer;touch-action:manipulation}.node{background:#25273a;border:1px solid #4b4d68;border-radius:10px;padding:9px;text-align:center;min-height:100px;display:flex;flex-direction:column;justify-content:center;gap:5px}.node button{padding:6px}.tabs,.actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.active{border-color:#f2c879;color:#f2c879}.bar{height:6px;background:#080911;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#8cdbad}.log{height:160px;overflow:auto;background:#10111b;padding:9px;border-radius:8px;font-size:13px}.log p{margin:0 0 5px}.notice{padding:10px;background:#292238;border:1px solid #514267;border-radius:9px;margin:8px 0}.enemy{text-align:center;padding:15px;background:#141522;border-radius:10px}.magicgrid,.list{display:grid;gap:7px;margin-top:8px}.magiccard,.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px;background:#151624;border:1px solid #34364c;border-radius:9px}.magiccard small{display:block}.intro{position:fixed;inset:0;z-index:5;background:#11121df5;display:flex;align-items:center;justify-content:center;padding:15px}.introbox{max-width:650px;background:#1d1f30;border:1px solid #756344;border-radius:15px;padding:22px}.introtext{white-space:pre-line;line-height:1.9}.intro button{width:100%;margin-top:12px;background:#665039;border-color:#f2c879}.toast{position:fixed;right:12px;bottom:15px;background:#f2c879;color:#201a12;padding:12px 16px;border-radius:9px;font-weight:bold;z-index:8}.footer{text-align:center;color:#888;margin:18px;font-size:11px}@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main>
<header><h1>輪廻の魔導士</h1><small>六日間の輪廻 — 忘れられる世界、残る魔法。</small><div class="actions"><button id="save">セーブ</button><button id="wipe">データ初期化</button></div></header>
<div class="stats"><div class="stat"><small>レベル / 周回</small><b id="lv"></b></div><div class="stat"><small>HP</small><b id="hp"></b><div class="bar"><i id="hbar"></i></div></div><div class="stat"><small>MP</small><b id="mp"></b><div class="bar"><i id="mbar"></i></div></div><div class="stat"><small>残り日数</small><b id="days"></b><div class="bar"><i id="dbar"></i></div></div></div>
<div class="tabs"><button data-tab="冒険">冒険</button><button data-tab="魔法">魔法</button><button data-tab="持ち物">持ち物</button><button data-tab="記録">記録</button></div><div id="view"></div><div class="footer">セーブはこの端末のブラウザ内に保存されます。</div></main>
<div class="intro" id="intro"><div class="introbox"><h2 id="ititle"></h2><div class="introtext" id="itext"></div><button id="inext">次へ</button></div></div>
<script>
(()=>{const $=x=>document.getElementById(x);
const spellData={"火球":[3,"攻撃",10],"氷槍":[4,"攻撃",14],"守護壁":[3,"防御",0],"癒やしの光":[4,"回復",15],"星喰らい":[7,"攻撃",30],"雷鳴":[5,"攻撃",19],"毒霧":[4,"攻撃",12],"再生":[6,"回復",24],"大地の鎧":[5,"防御",0]};
const names=["風刃","水弾","岩砕き","光矢","影縫い","炎嵐","氷壁","雷撃","吸命","浄化","月光","陽炎","幻惑","魔力吸収","魂の盾","爆裂","流星","霜華","黒雷","聖光","深淵の針","獄炎","天翔","生命の雫","魔封じ","空間裂き","夢幻","逆流","星屑","竜巻","結界","魔導砲","影の刃","紅蓮","白霧","地割れ","波動","霊体化","活力","魔力増幅","凍結","灼熱","雷光","虚無","天啓","魂魄","霧散","転生の灯","深呼吸","連鎖火球","氷結輪","毒牙","月影","太陽の槍","重力球","反射壁","守護の歌","血の契約","魔力循環","爆炎陣","流砂","幻影分身","聖域","夜の帳","天雷","星の雨","灼岩","水鏡","霊薬","光の翼","魔獣召喚","封印解除","時の砂","終焉の波","夢喰い","冥府の門","虹の矢","風神","氷神","火神","雷神","魔力転換","生命交換","竜の息吹","神速","大回復","星の守り","永久凍土","天上の火","闇の奔流","光輪","魔王殺し","輪廻断ち","永劫の鎖","世界再編","時空震","星の記憶","黎明"];
names.forEach((n,i)=>spellData[n]=[3+i%6,i%5===0?"回復":i%4===0?"防御":"攻撃",8+(i%9)*3]);
const fresh=()=>({lv:1,xp:0,learn:["火球"],loop:1,days:6,hp:30,maxhp:30,mp:12,maxmp:12,atk:5,def:2,gold:20,items:{薬草:2},weapon:"旅人の杖",armor:"布のローブ",log:["王様から旅支度を受け取った。"],intro:false,cleared:false});
let s=load(),battle=null,tab="冒険",introI=0;if(!s)s=fresh();
const pages=[["魔王の呪い","魔王により、世界は魔物で溢れる世界になってしまった…。\n\n王様「おお、勇者よ、今日が旅立ちの日だな。この世界を変えてしまった魔王を倒してくれ。頼んだぞ」\n\n王様から薬草×2と旅人の杖、布のローブをもらった。\n\nしかし、勇者はダラダラしていた…"],["6日後……","王様「おお、勇者よ、今日が旅立ちの日だな。この世界を変えてしまった魔王を倒してくれ。頼んだぞ」\n\n王様「何？1週間前にも言われたって？何を言っとるんじゃ」\n\nたしかに、王様から貰ったローブや薬草などは手元から無くなっている…。"],["輪廻の真相","6日に1回、リセットされてるだと！？\n\n魔王は時を操り、勇者の旅立ちから1週間後に時間を巻き戻していた。レベルと覚えた魔法だけが記憶に残る。\n\n魔王を倒せばリセットは終わる。世界に本当の明日を取り戻そう！"]];
const places=[["王都","🏘️","街","商店・民家。武器や薬草を買える。"],["魔物の森","🌲","戦闘","序盤の魔物が出現。"],["古代遺跡","🏛️","探索","古い魔法や宝が眠る。"],["深淵洞窟","🕳️","戦闘","洞窟の強敵。"],["ボーナスステージ","✨","ボーナス","高レベル向け。勝てば経験値大量。"],["チャレンジステージ","⚔️","挑戦","中級者向け。魔法ドロップを狙う。"],["合成工房","🧪","合成","魔法を2つ選んで合成。"],["時守りの塔","🗼","強敵","強力な守護者。"],["竜の墓場","🐉","強敵","古竜の巣。"],["聖域","🌟","探索","HP・MPが全回復。"],["魔王城","🏰","強敵","魔王の側近がいる。"],["魔王の間","👑","魔王","最初から挑めるが、桁外れに強い。"]];
function load(){try{return JSON.parse(localStorage.getItem("rinneMageSave2"))}catch(e){return null}}function save(){localStorage.setItem("rinneMageSave2",JSON.stringify(s))}
function msg(t){s.log.unshift(t);s.log=s.log.slice(0,25);draw()}function log(){return '<div class="log">'+s.log.map(t=>'<p>› '+esc(t)+'</p>').join("")+'</div>'}function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function stats(){$("lv").textContent="Lv."+s.lv+" / "+s.loop+"周目";$("hp").textContent=s.hp+" / "+s.maxhp;$("mp").textContent=s.mp+" / "+s.maxmp;$("days").textContent=s.days+" / 6";$("hbar").style.width=s.hp/s.maxhp*100+"%";$("mbar").style.width=s.mp/s.maxmp*100+"%";$("dbar").style.width=s.days/6*100+"%"}
function draw(){stats();$("view").innerHTML=battle?fightUI():tab==="冒険"?mapUI():tab==="魔法"?magicUI():tab==="持ち物"?itemsUI():statusUI();document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));save()}
function mapUI(){return '<div class="cols"><section class="panel"><h2>行き先を選ぶ</h2><p>行き先は自由。何度でも同じ場所へ行けますが、訪問ごとに1日消費。攻略条件は<strong>6手以内に魔王を倒す</strong>こと。</p><div class="grid">'+places.map((p,i)=>`<div class="node"><b>${p[1]} ${p[0]}</b><small>${p[3]}</small><button onclick="go(${i})">行く</button></div>`).join("")+'</div><div class="notice">転移門は廃止。魔王は初手から挑戦可能。ただし非常に強いので、準備とレベルが重要です。</div></section><section class="panel"><h2>輪廻の記録</h2><p>魔王は勇者の旅立ちから7日目に時を巻き戻す。6日間の行動で世界を攻略しよう。</p>'+log()+'<div class="actions"><button onclick="rest()">宿で休む（1日）</button><button onclick="resetNow()">時を待つ</button></div></section></div>'}
function fightUI(){return '<div class="cols"><section class="panel"><h2>戦闘</h2><div class="enemy">☠️<b>'+esc(battle.name)+'</b><div class="bar"><i style="width:'+Math.max(0,battle.hp/battle.max*100)*1+'%;background:#e87979"></i></div><small>'+Math.max(0,battle.hp)+' / '+battle.max+' HP</small></div><div class="actions"><button onclick="attack()">杖で攻撃</button><button onclick="toggleMagic()">魔法を使う</button><button onclick="potion()">薬草</button><button onclick="guard()">防御</button></div>'+(battle.show?'<div class="magicgrid">'+s.learn.map(n=>'<div class="magiccard"><div><b>'+esc(n)+'</b><small>MP'+spellData[n][0]+' · '+spellData[n][1]+'</small></div><button onclick="cast(\''+esc(n)+'\')">使う</button></div>').join("")+'</div>':'')+'</section><section class="panel"><h2>戦闘ログ</h2>'+log()+'</section></div>'}
function magicUI(){return '<section class="panel"><h2>習得魔法</h2><p>一度覚えた魔法は周回しても残ります。チャレンジステージでは約100種の魔法が重複ありでドロップします。</p><div class="list">'+s.learn.map(n=>'<div class="item"><b>'+esc(n)+'</b><span>MP '+spellData[n][0]+'</span></div>').join("")+'</div></section>'}
function itemsUI(){return '<section class="panel"><h2>持ち物・装備</h2><div class="list">'+Object.entries(s.items).map(([n,c])=>'<div class="item"><b>'+esc(n)+'</b><span>×'+c+'</span></div>').join("")+'<div class="item"><b>'+s.weapon+'</b><span>攻撃 '+s.atk+'</span></div><div class="item"><b>'+s.armor+'</b><span>防御 '+s.def+'</span></div></div></section>'}
function statusUI(){return '<section class="panel"><h2>勇者の記録</h2><div class="list">'+[['レベル',s.lv],['経験値',s.xp+'/'+s.lv*18],['周回',s.loop],['攻撃力',s.atk],['防御力',s.def],['所持金',s.gold+'G'],['習得魔法',s.learn.length+'種']].map(x=>'<div class="item"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join("")+'</div>'+(s.cleared?'<div class="notice"><h2>ENDING — 輪廻の終わり</h2>魔王は時を巻き戻す力を失った。王都には朝が訪れ、薬草も装備も消えない。王様「勇者よ、今度こそ本当の旅立ちじゃ！」世界は自由な明日を取り戻した。<b>ハッピーエンド！</b></div>':'')+'</section>'}
function spend(){s.days--;if(s.days<=0)loopReset()}function toast(){let e=document.createElement("div");e.className="toast";e.textContent="⌛ 6日が経った";document.body.append(e);setTimeout(()=>e.remove(),3000)}
function loopReset(){battle=null;s.loop++;s.days=6;s.hp=s.maxhp;s.mp=s.maxmp;s.gold=20;s.items={薬草:2};s.weapon="旅人の杖";s.armor="布のローブ";s.atk=5+(s.lv-1)*2;s.def=2+s.lv-1;s.log.unshift("⌛ 6日が経った——世界が巻き戻る。第"+s.loop+"周目。");toast();draw()}
function go(i){if(s.cleared)return;let p=places[i];spend();msg(p[0]+"へ向かった。");if(p[2]==="街"){tab="街";$("view").innerHTML=town();save();return}if(p[2]==="戦闘"){start(i===1?"森の魔獣":"洞窟の番人",i===1?16+s.loop*4:32+s.loop*6,i===1?4+s.loop:8+s.loop*2,i===1?9+s.loop*3:18+s.loop*4);return}if(p[2]==="ボーナス"){start("経験値喰らい",s.lv<6?100+s.loop*8:75+s.loop*8,13+s.loop*2,160+s.loop*25);msg("高レベル推奨。勝利時に経験値が大量に入る。");return}if(p[2]==="挑戦"){start("魔法喰らい",s.lv<3?55+s.loop*5:42+s.loop*5,9+s.loop*2,35+s.loop*4,-2);msg("推奨Lv.3以上。勝利で魔法がドロップ。");return}if(p[2]==="強敵"){let nm=["時守りの騎士","墓場の古竜","魔王の側近"][i-7];start(nm,45+s.loop*9,11+s.loop*2,35+s.loop*5);return}if(p[2]==="魔王"){start("時魔王クロノス",320+s.loop*40,38+s.loop*5,999,0,true);msg("魔王は時そのものを鎧にしている。");return}if(p[2]==="探索"){if(i===2){let n=unknown();if(n){s.learn.push(n);msg("遺跡の碑文から『"+n+"』を習得！")}else{s.gold+=25;msg("遺跡で25Gを発見。")}}else{s.hp=s.maxhp;s.mp=s.maxmp;msg("聖域でHPとMPが全回復。")}draw();return}if(p[2]==="合成"){tab="合成";alchemy();}}
function town(){return '<section class="panel"><h2>王都の商店</h2><p>品物を購入しよう。周回すると持ち物・装備・所持金はリセットされます。</p><div class="list">'+[['薬草','HP18回復',10],['旅人の剣','攻撃力+4',35],['魔導士の外套','防御力+3',30],['魔力結晶','MP10回復',15]].map(([n,d,c])=>'<div class="item"><div><b>'+n+'</b><small>'+d+' · '+c+'G</small></div><button onclick="buy(\''+n+'\','+c+')">購入</button></div>').join("")+'</div><div class="actions"><button onclick="home()">民家で全回復</button><button onclick="tab=\'冒険\';draw()">地図へ</button></div></section>'}
function buy(n,c){if(s.gold<c){msg("お金が足りない");return} s.gold-=c;if(n==="薬草")s.items[n]=(s.items[n]||0)+1;else if(n==="旅人の剣"){s.weapon=n;s.atk+=4}else if(n==="魔導士の外套"){s.armor=n;s.def+=3}else s.mp=Math.min(s.maxmp,s.mp+10);msg(n+"を購入");$("view").innerHTML=town();save()}
function home(){s.hp=s.maxhp;s.mp=s.maxmp;msg("民家で休み、全回復した。");tab="冒険";draw()}
function alchemy(){let opts=s.learn.map(n=>'<option>'+esc(n)+'</option>').join("");$("view").innerHTML='<section class="panel"><h2>魔法合成</h2><p>魔法を2つ選択。火球＋氷槍で星喰らいを合成できます。</p><div class="actions"><select id="a">'+opts+'</select><select id="b">'+opts+'</select><button onclick="fuse()">合成（1日）</button><button onclick="tab=\'冒険\';draw()">戻る</button></div>'+log()+'</section>'}
function fuse(){spend();let a=$("a").value,b=$("b").value;if(a!==b&&[a,b].includes("火球")&&[a,b].includes("氷槍")&&!s.learn.includes("星喰らい")){s.learn.push("星喰らい");msg("合成成功！星喰らいを習得。")}else{let n=unknown();if(n&&Math.random()<.25){s.learn.push(n);msg("未知の魔法『"+n+"』が生まれた！")}else msg("合成失敗。組み合わせを変えよう。")}tab="冒険";draw()}
function start(name,hp,atk,xp,boss=-1,final=false){battle={name,hp,max:hp,atk,xp,boss,final,guard:false,show:false};draw()}
function enemyTurn(){if(!battle)return;let d=Math.max(1,battle.atk-s.def);if(battle.guard){d=Math.max(1,Math.floor(d/3));battle.guard=false}s.hp-=d;msg(battle.name+"の攻撃！"+d+"ダメージ");if(s.hp<=0){s.hp=0;battle=null;msg("勇者は倒れた。時が巻き戻る……");loopReset()}}
function hit(d){battle.hp-=d;msg(battle.name+"に"+d+"ダメージ！");if(battle.hp<=0){let b=battle;battle=null;win(b)}else enemyTurn();draw()}
function attack(){if(battle)hit(s.atk+(s.lv-1)*2)}function toggleMagic(){if(battle){battle.show=!battle.show;draw()}}
function cast(n){if(!battle)return;let [cost,type,power]=spellData[n];if(s.mp<cost){msg("MPが足りない");draw();return}s.mp-=cost;if(type==="攻撃"){hit(power+(s.lv-1)*3);return}if(type==="回復"){s.hp=Math.min(s.maxhp,s.hp+power);msg(n+"でHP回復");enemyTurn()}else{battle.guard=true;msg(n+"を展開");enemyTurn()}draw()}
function potion(){if(!battle)return;if(!s.items.薬草){msg("薬草がない");draw();return}s.items.薬草--;s.hp=Math.min(s.maxhp,s.hp+18);msg("薬草でHP18回復");enemyTurn();draw()}
function guard(){if(battle){battle.guard=true;msg("身構えた");enemyTurn();draw()}}
function win(b){s.xp+=b.xp;msg(b.name+"撃破！経験値"+b.xp);if(b.boss===-2){let n=unknown();if(n){s.learn.push(n);msg("魔法ドロップ！"+n+"を習得")}else msg("重複魔法だったため習得できない")}if(b.final){s.cleared=true;s.days=6;msg("魔王を倒した！時間の呪いが消えた。")}while(s.xp>=s.lv*18){s.xp-=s.lv*18;s.lv++;s.maxhp+=7;s.maxmp+=4;s.atk+=2;s.def++;s.hp=s.maxhp;s.mp=s.maxmp;msg("レベルアップ！Lv."+s.lv);if(s.lv===2&&!s.learn.includes("氷槍"))s.learn.push("氷槍");if(s.lv===3&&!s.learn.includes("守護壁"))s.learn.push("守護壁");if(s.lv===4&&!s.learn.includes("癒やしの光"))s.learn.push("癒やしの光");if(s.lv>=5&&s.learn.includes("火球")&&s.learn.includes("氷槍")&&!s.learn.includes("星喰らい"))s.learn.push("星喰らい")}draw()}
function unknown(){let a=names.filter(n=>!s.learn.includes(n));return a.length?a[Math.floor(Math.random()*a.length)]:null}
function rest(){spend();s.hp=Math.min(s.maxhp,s.hp+10);s.mp=Math.min(s.maxmp,s.mp+6);msg("宿でHP10・MP6回復");draw()}function resetNow(){s.days=0;loopReset()}
function introShow(){introI=0;showPage();$("intro").style.display="flex"}function showPage(){$("ititle").textContent=pages[introI][0];$("itext").textContent=pages[introI][1].replace(/\\n/g,"\n");$("inext").textContent=introI===pages.length-1?"冒険を始める":"次へ"}
$("inext").onclick=()=>{introI++;if(introI>=pages.length){$("intro").style.display="none";s.intro=true;save();draw()}else showPage()};
function switchTab(t){tab=t;draw()}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
$("save").onclick=()=>{save();msg("セーブしました")};$("wipe").onclick=()=>{if(confirm("データを初期化しますか？")){localStorage.removeItem("rinneMageSave2");s=fresh();battle=null;introShow();draw()}};
Object.assign(window,{go,rest,resetNow,attack,toggleMagic,cast,potion,guard,buy,home,fuse});
if(!s.intro)introShow();else $("intro").style.display="none";draw();
})();
</script></body></html>
